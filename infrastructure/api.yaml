AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Announcements microservice - API stack. Imports the merged OpenAPI document
  from S3, so the deployed API Gateway resources, methods, models, validators
  and authorizer are all generated from the same contract that is published to
  consumers. Depends on the foundation stack for the Lambda targets, the
  Cognito authorization server and the alert topic.

# -----------------------------------------------------------------------------
Parameters:
# -----------------------------------------------------------------------------
  FoundationStackName:
    Type: String
    Description: Name of the deployed foundation stack whose outputs are imported.

  ServiceName:
    Type: String
    Default: announcements
    AllowedPattern: '^[a-z][a-z0-9-]{2,24}$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, tst, acc, stg, prod]

  StageName:
    Type: String
    Default: v1
    AllowedPattern: '^[a-zA-Z0-9_-]{1,32}$'
    Description: >-
      Deployment stage only. The API version travels in the Api-Version
      header, never in the URL.

  OpenApiBucket:
    Type: String
    Description: S3 bucket holding the merged OpenAPI document.

  OpenApiKey:
    Type: String
    Description: >-
      S3 key of the merged OpenAPI document. It contains a hash of the
      document, so a contract change produces a new key and CloudFormation
      re-imports rather than keeping the old definition.

  ThrottleRateLimit:
    Type: Number
    Default: 50
    MinValue: 1
    Description: >-
      Steady-state requests per second allowed by the stage. Exceeding it
      yields 429.

  ThrottleBurstLimit:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Burst capacity on top of the steady-state rate.

  ConfigureApiGatewayCloudWatchRole:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Sets the account-wide API Gateway CloudWatch Logs role. Set false if
      another stack in this account already owns it.

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365, 400, 545, 731, 1827, 3653]

# -----------------------------------------------------------------------------
Conditions:
# -----------------------------------------------------------------------------
  ManageCloudWatchRole: !Equals [!Ref ConfigureApiGatewayCloudWatchRole, 'true']

# -----------------------------------------------------------------------------
Resources:
# -----------------------------------------------------------------------------

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ServiceName}-${EnvironmentName}'
      Description: !Sub 'Announcements API (${EnvironmentName})'
      EndpointConfiguration:
        Types: [REGIONAL]
      # gzip, applied only when the client asks for it.
      MinimumCompressionSize: 1024
      # The contract is the deployment: nothing about the API is defined here
      # that is not in the OpenAPI document.
      BodyS3Location:
        Bucket: !Ref OpenApiBucket
        Key: !Ref OpenApiKey
      Tags:
        - { Key: Service, Value: !Ref ServiceName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  # --- Permissions for API Gateway to invoke the handlers ---------------
  ListFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${FoundationStackName}-ListFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # Scoped to this API and method, so no other API can invoke the handler.
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/announcements'

  CreateFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${FoundationStackName}-CreateFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/announcements'

  # --- Deployment and stage ---------------------------------------------
  Deployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub 'Imported from s3://${OpenApiBucket}/${OpenApiKey}'

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ServiceName}-${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionInDays

  Stage:
    Type: AWS::ApiGateway::Stage
    # Stage creation fails if the account-level logging role is not yet set.
    DependsOn: ApiGatewayAccount
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      StageName: !Ref StageName
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        # JSON for Logs Insights. Never bodies, Api-Key or Authorization.
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLatencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency","responseLength":"$context.responseLength","apiVersion":"$context.request.header.Api-Version","userAgent":"$context.identity.userAgent","sourceIp":"$context.identity.sourceIp","oauthClientId":"$context.authorizer.claims.client_id","errorMessage":"$context.error.message"}
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          MetricsEnabled: true
          # Data tracing off, so payloads and credentials never reach logs.
          LoggingLevel: INFO
          DataTraceEnabled: false
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit
      Tags:
        - { Key: Service, Value: !Ref ServiceName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: ManageCloudWatchRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs'

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: ManageCloudWatchRole
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # --- Alarms -----------------------------------------------------------
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ServiceName}-${EnvironmentName}-api-5xx'
      AlarmDescription: The API is returning server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - { Name: ApiName, Value: !Sub '${ServiceName}-${EnvironmentName}' }
        - { Name: Stage, Value: !Ref StageName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${FoundationStackName}-AlertsTopicArn'}]
      OKActions: [{'Fn::ImportValue': !Sub '${FoundationStackName}-AlertsTopicArn'}]

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ServiceName}-${EnvironmentName}-api-latency'
      AlarmDescription: p99 end-to-end API latency is above the 2s objective.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - { Name: ApiName, Value: !Sub '${ServiceName}-${EnvironmentName}' }
        - { Name: Stage, Value: !Ref StageName }
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${FoundationStackName}-AlertsTopicArn'}]

  # Alarms on the ratio, not a raw count that would scale with traffic.
  ApiClientErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ServiceName}-${EnvironmentName}-api-4xx-rate'
      AlarmDescription: More than a quarter of requests are being rejected.
      Threshold: 0.25
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${FoundationStackName}-AlertsTopicArn'}]
      Metrics:
        - Id: errorRate
          Expression: IF(requests > 20, errors / requests, 0)
          Label: 4xx rate
          ReturnData: true
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 4XXError
              Dimensions:
                - { Name: ApiName, Value: !Sub '${ServiceName}-${EnvironmentName}' }
                - { Name: Stage, Value: !Ref StageName }
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - { Name: ApiName, Value: !Sub '${ServiceName}-${EnvironmentName}' }
                - { Name: Stage, Value: !Ref StageName }
            Period: 300
            Stat: Sum

  # --- Dashboard --------------------------------------------------------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ServiceName}-${EnvironmentName}'
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "API traffic and errors",
                  "region": "${AWS::Region}",
                  "stat": "Sum", "period": 300, "view": "timeSeries",
                  "metrics": [
                    ["AWS/ApiGateway", "Count", "ApiName", "${ApiName}", "Stage", "${StageName}", {"label": "requests"}],
                    [".", "4XXError", ".", ".", ".", ".", {"label": "4xx"}],
                    [".", "5XXError", ".", ".", ".", ".", {"label": "5xx"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "API latency",
                  "region": "${AWS::Region}",
                  "period": 300, "view": "timeSeries",
                  "metrics": [
                    ["AWS/ApiGateway", "Latency", "ApiName", "${ApiName}", "Stage", "${StageName}", {"stat": "p50", "label": "p50"}],
                    ["...", {"stat": "p99", "label": "p99"}],
                    ["AWS/ApiGateway", "IntegrationLatency", "ApiName", "${ApiName}", "Stage", "${StageName}", {"stat": "p99", "label": "integration p99"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda",
                  "region": "${AWS::Region}",
                  "stat": "Sum", "period": 300, "view": "timeSeries",
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${ListFunctionName}", {"label": "list invocations"}],
                    [".", "Errors", ".", ".", {"label": "list errors"}],
                    [".", "Throttles", ".", ".", {"label": "list throttles"}],
                    [".", "Invocations", ".", "${CreateFunctionName}", {"label": "create invocations"}],
                    [".", "Errors", ".", ".", {"label": "create errors"}]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "DynamoDB",
                  "region": "${AWS::Region}",
                  "stat": "Sum", "period": 300, "view": "timeSeries",
                  "metrics": [
                    ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TableName}", {"label": "RCU"}],
                    [".", "ConsumedWriteCapacityUnits", ".", ".", {"label": "WCU"}],
                    [".", "ThrottledRequests", ".", ".", {"label": "throttles"}]
                  ]
                }
              },
              {
                "type": "log", "x": 0, "y": 12, "width": 24, "height": 6,
                "properties": {
                  "title": "Recent rejections and failures",
                  "region": "${AWS::Region}",
                  "query": "SOURCE '/aws/lambda/${ListFunctionName}' | SOURCE '/aws/lambda/${CreateFunctionName}' | fields @timestamp, level, httpMethod, statusCode, errorCode, requestId, durationMs | filter statusCode >= 400 | sort @timestamp desc | limit 50"
                }
              }
            ]
          }
        - ApiName: !Sub '${ServiceName}-${EnvironmentName}'
          ListFunctionName: {'Fn::ImportValue': !Sub '${FoundationStackName}-ListFunctionName'}
          CreateFunctionName: {'Fn::ImportValue': !Sub '${FoundationStackName}-CreateFunctionName'}
          TableName: {'Fn::ImportValue': !Sub '${FoundationStackName}-TableName'}

# -----------------------------------------------------------------------------
Outputs:
# -----------------------------------------------------------------------------
  RestApiId:
    Value: !Ref RestApi
    Export: { Name: !Sub '${AWS::StackName}-RestApiId' }

  StageName:
    Value: !Ref StageName
    Export: { Name: !Sub '${AWS::StackName}-StageName' }

  InvokeUrl:
    Description: >-
      Base URL of the deployed API. In production this sits behind a custom
      domain matching https://{host}.api.philips.com/communications.
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
    Export: { Name: !Sub '${AWS::StackName}-InvokeUrl' }

  AnnouncementsUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/announcements'

  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ServiceName}-${EnvironmentName}'
