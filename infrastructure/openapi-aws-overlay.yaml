# AWS API Gateway bindings for the Announcements API.
#
# The published contract (../api/openapi.yaml) must stay
# implementation-agnostic, so every `x-amazon-apigateway-*` extension lives
# here and is merged in at build time by ../scripts/build_openapi.py. The
# merged document is what API Gateway imports, so the deployed API and the
# published contract cannot drift apart.
#
# ${...} placeholders are filled from the foundation stack's outputs.

# No API Gateway request validator. It would be cheaper to reject malformed
# payloads at the edge, but the gateway can only ever answer 400, and the
# contract - following JSON API, as the guidelines require - owes 403 for a
# client-generated id and 409 for a mismatched type. A validator here would
# short-circuit both. The handler is the single validation authority, and it
# is the only layer that can produce a JSON Pointer to the offending member.

components:
  securitySchemes:
    announcementsOAuth2:
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - ${USER_POOL_ARN}
      flows:
        clientCredentials:
          tokenUrl: ${TOKEN_URL}
          refreshUrl: ${TOKEN_URL}

paths:
  /announcements:
    get:
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        timeoutInMillis: 10000
        uri: >-
          arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${LIST_FUNCTION_NAME}/invocations

    post:
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        timeoutInMillis: 10000
        uri: >-
          arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${CREATE_FUNCTION_NAME}/invocations

    # Preflight is served by a mock integration, keeping browsers off the
    # Lambda bill. Deny-by-default: one origin, and only the methods and
    # headers this resource uses.
    options:
      # Declared so the mock integration may map values onto them.
      responses:
        '204':
          headers:
            Access-Control-Allow-Origin: { schema: { type: string } }
            Access-Control-Allow-Methods: { schema: { type: string } }
            Access-Control-Allow-Headers: { schema: { type: string } }
            Access-Control-Max-Age: { schema: { type: integer } }
            Vary: { schema: { type: string } }
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 204}'
        responses:
          default:
            statusCode: '204'
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'${ALLOWED_ORIGIN}'"
              method.response.header.Access-Control-Allow-Methods: "'GET, POST, OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type, Api-Key, Api-Version, Authorization, If-None-Match, Accept, Accept-Encoding'"
              method.response.header.Access-Control-Max-Age: "'3600'"
              method.response.header.Vary: "'Origin'"

    # Any verb the contract does not define gets a 405. Without this, API
    # Gateway would answer 403 MISSING_AUTHENTICATION_TOKEN. Declared methods
    # always win over this catch-all.
    x-amazon-apigateway-any-method:
      security: []
      responses:
        '405':
          description: The HTTP method is not supported for this resource.
          headers:
            Allow: { schema: { type: string } }
            Content-Type: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDocument' }
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 405}'
        responses:
          default:
            statusCode: '405'
            responseParameters:
              method.response.header.Allow: "'GET, POST, OPTIONS'"
              method.response.header.Content-Type: "'application/json'"
              method.response.header.Cache-Control: "'no-store'"
            responseTemplates:
              application/json: |-
                {"errors":[{"id":"$context.requestId","status":"405","code":"METHOD_NOT_ALLOWED","title":"Method not allowed","detail":"This resource supports GET, POST and OPTIONS."}],"meta":{"requestId":"$context.requestId"}}

# Error format for everything API Gateway rejects before a handler runs.
#
# These live in the document rather than as AWS::ApiGateway::GatewayResponse
# resources because importing an OpenAPI definition overwrites the API's
# gateway responses. CloudFormation would see the resources unchanged, do
# nothing, and the API would silently fall back to AWS's {"message": "..."}
# bodies on the second and every later deploy.
x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","code":"BAD_REQUEST","title":"Bad request","detail":"The request could not be processed as submitted."}],"meta":{"requestId":"$context.requestId"}}'
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"500","code":"SERVER_ERROR","title":"Server error","detail":"The request could not be processed. Quote the error id when reporting this."}],"meta":{"requestId":"$context.requestId"}}'
  BAD_REQUEST_BODY:
    statusCode: '400'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"400","code":"INVALID_PARAMETER_VALUE","title":"Invalid parameter value","detail":"$util.escapeJavaScript($context.error.validationErrorString)","source":{"pointer":"/data"}}],"meta":{"requestId":"$context.requestId"}}'
  BAD_REQUEST_PARAMETERS:
    statusCode: '400'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"400","code":"MISSING_PARAMETER","title":"Missing required parameter","detail":"$util.escapeJavaScript($context.error.validationErrorString)"}],"meta":{"requestId":"$context.requestId"}}'
  UNAUTHORIZED:
    statusCode: '401'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.WWW-Authenticate: '''Bearer realm="announcements"'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"401","code":"UNAUTHORIZED","title":"Unauthorized","detail":"A valid access token is required for this operation."}],"meta":{"requestId":"$context.requestId"}}'
  EXPIRED_TOKEN:
    statusCode: '401'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.WWW-Authenticate: '''Bearer realm="announcements", error="invalid_token"'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"401","code":"UNAUTHORIZED","title":"Unauthorized","detail":"The access token has expired."}],"meta":{"requestId":"$context.requestId"}}'
  INVALID_SIGNATURE:
    statusCode: '401'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.WWW-Authenticate: '''Bearer realm="announcements", error="invalid_token"'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"401","code":"UNAUTHORIZED","title":"Unauthorized","detail":"The access token signature could not be verified."}],"meta":{"requestId":"$context.requestId"}}'
  ACCESS_DENIED:
    statusCode: '403'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.WWW-Authenticate: '''Bearer realm="announcements", error="insufficient_scope", scope="announcements/write"'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"403","code":"INSUFFICIENT_SCOPE","title":"Insufficient scope","detail":"The access token does not carry the announcements/write scope."}],"meta":{"requestId":"$context.requestId"}}'
  MISSING_AUTHENTICATION_TOKEN:
    statusCode: '404'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"404","code":"RESOURCE_NOT_FOUND","title":"Resource not found","detail":"The requested resource does not exist."}],"meta":{"requestId":"$context.requestId"}}'
  RESOURCE_NOT_FOUND:
    statusCode: '404'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"404","code":"RESOURCE_NOT_FOUND","title":"Resource not found","detail":"The requested resource does not exist."}],"meta":{"requestId":"$context.requestId"}}'
  THROTTLED:
    statusCode: '429'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Retry-After: '''1'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"429","code":"TOO_MANY_REQUESTS","title":"Too many requests","detail":"Rate limit exceeded. Please retry later."}],"meta":{"requestId":"$context.requestId"}}'
  QUOTA_EXCEEDED:
    statusCode: '429'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"429","code":"TOO_MANY_REQUESTS","title":"Too many requests","detail":"The quota for this client has been exhausted."}],"meta":{"requestId":"$context.requestId"}}'
  UNSUPPORTED_MEDIA_TYPE:
    statusCode: '415'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"415","code":"UNSUPPORTED_MEDIA_TYPE","title":"Unsupported media type","detail":"This API only consumes application/json."}],"meta":{"requestId":"$context.requestId"}}'
  REQUEST_TOO_LARGE:
    statusCode: '413'
    responseParameters:
      gatewayresponse.header.Content-Type: '''application/json'''
      gatewayresponse.header.Cache-Control: '''no-store'''
      gatewayresponse.header.Access-Control-Allow-Origin: '''${ALLOWED_ORIGIN}'''
    responseTemplates:
      application/json: '{"errors":[{"id":"$context.requestId","status":"413","code":"BAD_REQUEST","title":"Payload too large","detail":"The request body exceeds the maximum accepted size."}],"meta":{"requestId":"$context.requestId"}}'
